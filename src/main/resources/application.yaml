spring:
  application:
    name: howmuch-finance-connector
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:howmuch-finance-connector}
      auto-offset-reset: earliest
      enable-auto-commit: false
finance:
  internal:
    service-token: ${CONNECTOR_INTERNAL_SERVICE_TOKEN}
    data-key: ${CONNECTOR_DATA_KEY}
  messaging:
    enabled: ${FINANCE_MESSAGING_ENABLED:false}
    command-topic: finance.sync.command.v1
  collection:
    enabled: ${FINANCE_COLLECTION_ENABLED:false}
    poll-delay: ${FINANCE_COLLECTION_POLL_DELAY:500}
  event-relay:
    enabled: ${FINANCE_EVENT_RELAY_ENABLED:false}
    poll-delay: ${FINANCE_EVENT_RELAY_POLL_DELAY:200}
  codef:
    base-url: ${CODEF_BASE_URL:https://development.codef.io}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    connect-timeout: ${CODEF_CONNECT_TIMEOUT:5s}
    read-timeout: ${CODEF_READ_TIMEOUT:305s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  shutdown: graceful
