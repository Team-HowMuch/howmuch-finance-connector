spring:
  application:
    name: howmuch-finance-connector
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:howmuch-finance-connector}
      auto-offset-reset: earliest
      enable-auto-commit: false
finance:
  internal:
    service-token: ${CONNECTOR_INTERNAL_SERVICE_TOKEN}
    data-key: ${CONNECTOR_DATA_KEY}
  messaging:
    enabled: ${FINANCE_MESSAGING_ENABLED:false}
    command-topic: finance.sync.command.v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  shutdown: graceful
