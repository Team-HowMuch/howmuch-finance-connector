spring:
  application:
    name: howmuch-finance-connector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/howmuch_finance_connector}
    username: ${DB_USERNAME:howmuch_finance_connector}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 1

connector:
  internal:
    service-token: ${CONNECTOR_SERVICE_TOKEN:}

finance:
  messaging:
    enabled: ${FINANCE_MESSAGING_ENABLED:true}
  kafka:
    command-topic: ${FINANCE_COMMAND_TOPIC:finance.sync.command.v1}
    event-topic: ${FINANCE_EVENT_TOPIC:finance.sync.event.v1}
    connector-group-id: ${FINANCE_CONNECTOR_GROUP_ID:finance-connector-sync-v1}

external:
  codef:
    base-url: ${CODEF_BASE_URL:https://development.codef.io}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    encode-body: ${CODEF_ENCODE_BODY:true}
    token-refresh-skew: ${CODEF_TOKEN_REFRESH_SKEW:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8081}
