name: Connector CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: howmuch_finance_connector_test
          POSTGRES_USER: howmuch_connector_test
          POSTGRES_PASSWORD: connector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howmuch_connector_test -d howmuch_finance_connector_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew clean build --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://127.0.0.1:5432/howmuch_finance_connector_test
          DB_USERNAME: howmuch_connector_test
          DB_PASSWORD: connector_test
