plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.amateur'
version = '1.0.0-rc.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

publishing {
    publications {
        contracts(MavenPublication) {
            from components.java
            artifactId = 'howmuch-finance-contracts'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Team-HowMuch/howmuch-finance-connector')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
