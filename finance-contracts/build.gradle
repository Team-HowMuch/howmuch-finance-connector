plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.amateur'
version = '1.0.0-rc.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.networknt:json-schema-validator:2.0.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        contracts(MavenPublication) {
            from components.java
            artifactId = 'howmuch-finance-contracts'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Team-HowMuch/howmuch-finance-connector')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
